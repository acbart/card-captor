[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "card-captor"
version = "0.1.0"
description = "Local-only processing of student index card quizzes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
quizcards = "cardcaptor.cli.main:app"
quizcards-web = "cardcaptor.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cardcaptor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
